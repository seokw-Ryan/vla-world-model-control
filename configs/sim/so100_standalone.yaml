# SO-100 Standalone Isaac Sim Configuration
physics:
  dt: 0.016667  # 1/60 seconds
  control_decimation: 12  # 12 physics steps per control step = 5 Hz

robot:
  type: so100
  urdf_path: "assets/so100/so100.urdf"
  usd_path: "assets/so100/so100.usd"
  prim_path: "/World/SO100"
  # Joint names in URDF order
  joint_names:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  # Default joint positions (radians) — neutral idle pose used on reset
  default_joint_positions: [0.0, 1.0, -1.0, -0.5, 0.0, 0.5]
  # Place the robot near the left table edge so its reachable workspace is on the table surface
  # in front of the gripper instead of deep inside the table footprint.
  # Keep z slightly ABOVE the tabletop top surface or the arm will spawn intersecting the table.
  position: [-0.18, 0.0, 0.42]
  # Rotate the base 90 degrees counterclockwise around +Z so the arm faces into the table workspace.
  orientation: [0.7071068, 0.0, 0.0, 0.7071068]  # wxyz, +90 deg yaw

camera:
  prim_path: "/World/Camera"
  resolution: [640, 480]
  # Camera placement captured from the Isaac Sim viewport (Property panel).
  position: [-0.20951, 0.04278, 2.40000]
  # Euler XYZ (degrees) — matches the "Orient" widget in the Property panel.
  # Takes precedence over `target` look-at when provided.
  orientation_euler_xyz_deg: [-1.368, -11.654, -96.742]
  # Fallback target used only when no explicit orientation_euler_xyz_deg / orientation_wxyz is set.
  target: [0.12, 0.0, 0.40]
  focal_length: 15.0

scene:
  table:
    enabled: true
    prim_path: "/World/Table"
    position: [0.12, 0.0, 0.38]
    size: [0.70, 0.60, 0.04]
    color: [0.4, 0.3, 0.2]
  cube:
    prim_path: "/World/Cube"
    # Place the default cube to the robot's left/front in the reachable tabletop workspace.
    position: [-0.21, 0.14, 0.415]
    orientation: [1.0, 0.0, 0.0, 0.0]  # reset to identity each episode
    size: 0.03  # slightly smaller cube for smaller arm
    color: [0.9, 0.1, 0.1]
    mass: 0.05
    lift_height: 0.48
    spawn:
      # Sample uniformly from a rectangle on the tabletop:
      # 1) start from the table top bounds,
      # 2) inset by edge_margin + half cube width,
      # 3) intersect that with a rectangle expressed in TABLE-local coordinates.
      # This keeps cube placement tied to the table frame instead of the robot frame.
      mode: tabletop_rect
      edge_margin: 0.05
      # Use a substantially larger table-frame box so resets vary meaningfully
      # across the tabletop instead of collapsing into a narrow strip near the edge.
      table_local_x: [-0.23, -0.18]
      table_local_y: [0.10, 0.22]
      z: 0.415
